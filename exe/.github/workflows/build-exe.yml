name: Generar .exe

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Compilar y empaquetar
        shell: cmd
        run: build-exe.bat

      - name: Comprimir
        shell: pwsh
        run: Compress-Archive -Path dist\SIA -DestinationPath SIA-Windows.zip

      - name: Subir como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: SIA-Windows
          path: SIA-Windows.zip

      - name: Publicar en Releases (solo con tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SIA-Windows.zip
